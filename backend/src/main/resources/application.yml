spring:
  application:
    name: backend

nasa:
    api-key: ${NASA_API_KEY}
    baseURL: "https://api.nasa.gov"

---
spring:
    config:
        activate:
            on-profile: dev



---
spring:
    config:
        activate:
            on-profile: prod

---
spring:
    datasource:
        url: jdbc:h2:mem:telemetry
        driver-class-name: org.h2.Driver
        username: sa
        password: ""
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
    h2:
        console:
            enabled: true
            path: /h2-console
